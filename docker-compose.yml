# Local development database only. Credentials below are throwaway local defaults
# that match .env.example; never reuse them anywhere else.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: branchflow
      POSTGRES_PASSWORD: branchflow
      POSTGRES_DB: branchflow
    ports:
      - "5432:5432"
    volumes:
      - branchflow-pg:/var/lib/postgresql/data
      - ./scripts/docker-init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U branchflow -d branchflow"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  branchflow-pg:
