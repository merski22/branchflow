name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, type-check, test, build, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: branchflow
          POSTGRES_PASSWORD: branchflow
          POSTGRES_DB: branchflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U branchflow -d branchflow"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    # Throwaway CI database credentials only; no secrets are used by this workflow.
    env:
      DATABASE_URL: postgres://branchflow:branchflow@localhost:5432/branchflow
      TEST_DATABASE_URL: postgres://branchflow:branchflow@localhost:5432/branchflow_test
      AUTH_MODE: dev
      DEV_AUTH_DEFAULT_USER_EMAIL: avery.manager@synthetic.branchflow.test
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create test database
        run: psql "$DATABASE_URL" -c "CREATE DATABASE branchflow_test OWNER branchflow"

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Unit and integration tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
